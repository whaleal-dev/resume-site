<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" baseProfile="tiny" x="0" y="0" width="1600" height="900" viewBox="0 0 1600 900"><defs/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker><marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker><marker id="recoverArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#e11d48" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker></defs><rect fill="#ffffff" x="0" y="0" width="1600" height="900"/><text fill="#172033" x="48" y="56"><tspan>DDT 全量同步核心数据流</tspan></text><text fill="#526074" x="48" y="84"><tspan>设计原则：按范围拆分任务，以受控并发提升吞吐，用有界缓存解耦读写，并在失败时可恢复。</tspan></text><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="120" width="1520" height="370" rx="15.2" ry="14.8"/><text fill="#172033" x="70" y="158"><tspan>主数据流</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="70" y="234" width="200" height="124" rx="12" ry="11.78"/><text fill="#172033" x="101" y="274"><tspan>源端集合</tspan></text><text fill="#344258" x="101" y="304"><tspan>按白名单筛选</tspan></text><text fill="#526074" x="101" y="330"><tspan>确定需要迁移的数据范围</tspan></text><rect fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" x="342" y="211" width="250" height="170" rx="11.25" ry="11.9"/><text fill="#172033" x="373" y="251"><tspan>范围切分</tspan></text><text fill="#344258" x="373" y="281"><tspan>按 _id 类型与范围拆分</tspan></text><text fill="#344258" x="373" y="307"><tspan>生成连续的读取任务</tspan></text><text fill="#526074" x="373" y="337"><tspan>根据文档平均大小动态确定批量大小</tspan></text><rect fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" x="664" y="234" width="240" height="124" rx="12" ry="11.78"/><text fill="#172033" x="695" y="274"><tspan>任务队列</tspan></text><text fill="#344258" x="695" y="304"><tspan>暂存待读取范围</tspan></text><text fill="#526074" x="695" y="330"><tspan>多个集合的任务可交错执行</tspan></text><rect fill="#eff6ff" stroke="#3b82f6" stroke-width="2" x="976" y="211" width="260" height="170" rx="11.7" ry="11.9"/><text fill="#172033" x="1007" y="251"><tspan>受控并发读取</tspan></text><text fill="#344258" x="1007" y="281"><tspan>活跃读取任务不超过上限</tspan></text><text fill="#344258" x="1007" y="307"><tspan>按范围顺序读取文档并组批</tspan></text><text fill="#526074" x="1007" y="337"><tspan>每个读取任务负责一个数据区间</tspan></text><rect fill="#fff7ed" stroke="#f97316" stroke-width="2.5" x="1308" y="196" width="210" height="200" rx="11.55" ry="12"/><text fill="#172033" x="1339" y="236"><tspan>分区有界缓存</tspan></text><text fill="#344258" x="1339" y="266"><tspan>暂存读取批次</tspan></text><text fill="#344258" x="1339" y="294"><tspan>读写线程相互解耦</tspan></text><text fill="#526074" x="1339" y="328"><tspan>缓存满时阻塞读取端</tspan></text><text fill="#526074" x="1339" y="352"><tspan>将写入压力反压至源端</tspan></text><path fill="none" stroke="#334155" stroke-width="2.5" d="M 270 296 L 342 296 M 592 296 L 664 296 M 904 296 L 976 296 M 1236 296 L 1308 296" marker-end="url(#arrow)"/><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 1413 396 L 1413 442 L 1106 442 L 1106 381" marker-end="url(#feedbackArrow)"/><text fill="#526074" x="1131" y="430"><tspan>有界缓存提供自然背压</tspan></text><rect fill="#fff1f2" stroke="#f43f5e" stroke-width="2" x="638" y="412" width="240" height="50" rx="9.6" ry="10"/><text fill="#344258" x="667" y="443"><tspan>读取异常：从已读位置续读剩余范围</tspan></text><path fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6,5" d="M 1106 381 L 1106 412 L 878 412" marker-end="url(#recoverArrow)"/><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="530" width="1520" height="174" rx="15.2" ry="15.66"/><text fill="#172033" x="70" y="568"><tspan>写入与容错</tspan></text><rect fill="#fff7ed" stroke="#f97316" stroke-width="2.5" x="208" y="592" width="270" height="76" rx="10.8" ry="11.78"/><text fill="#172033" x="240" y="623"><tspan>从分区缓存获取批次</tspan></text><text fill="#344258" x="240" y="648"><tspan>写入端持续消费已就绪的数据</tspan></text><rect fill="#f0fdf4" stroke="#22c55e" stroke-width="2" x="665" y="592" width="270" height="76" rx="10.8" ry="11.78"/><text fill="#172033" x="697" y="623"><tspan>批量写入目标端</tspan></text><text fill="#344258" x="697" y="648"><tspan>优先使用有序批量写入保证一致性</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="1122" y="592" width="270" height="76" rx="10.8" ry="11.78"/><text fill="#172033" x="1154" y="623"><tspan>目标端集合</tspan></text><text fill="#344258" x="1154" y="648"><tspan>完成数据落库</tspan></text><path fill="none" stroke="#334155" stroke-width="2.5" d="M 478 630 L 665 630 M 935 630 L 1122 630" marker-end="url(#arrow)"/><path fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6,5" d="M 800 668 L 800 690 L 585 690 L 585 668" marker-end="url(#recoverArrow)"/><text fill="#526074" x="609" y="695"><tspan>批量失败：自动降为逐条写入重试</tspan></text><rect fill="#f1f5f9" stroke="#64748b" stroke-width="2" x="40" y="744" width="1520" height="106" rx="15.2" ry="15.9"/><text fill="#172033" x="70" y="782"><tspan>收敛与结束</tspan></text><text fill="#344258" x="70" y="812"><tspan>当范围任务生成结束、任务队列为空、读取任务结束且分区缓存清空后，等待写入完成并释放连接与线程资源。</tspan></text><circle fill="#172033" cx="1454" cy="796" r="15"/><text fill="#ffffff" x="1450" y="800"><tspan>OK</tspan></text></svg>
