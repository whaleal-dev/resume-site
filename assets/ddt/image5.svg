<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" baseProfile="tiny" x="0" y="0" width="1500" height="1040" viewBox="0 0 1500 1040"><defs/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker><marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker><marker id="safetyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#e11d48" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker></defs><rect fill="#ffffff" x="0" y="0" width="1500" height="1040"/><text fill="#172033" x="48" y="54"><tspan>DDT 全量迁移双线程自适应限流策略</tspan></text><text fill="#526176" x="48" y="82"><tspan>读线程以队列水位快速跟随，写线程以吞吐梯度慢速寻优；队列是供需反馈与背压中枢。</tspan></text><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="120" width="1420" height="275" rx="14.2" ry="15.125"/><text fill="#172033" x="68" y="157"><tspan>数据平面：生产者 - 消费者</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="72" y="204" width="180" height="118" rx="11.7" ry="11.8"/><text fill="#172033" x="101" y="247"><tspan>源端 MongoDB</tspan></text><text fill="#26354c" x="103" y="274"><tspan>按范围拉取数据</tspan></text><rect fill="#eff6ff" stroke="#3b82f6" stroke-width="2" x="337" y="184" width="265" height="158" rx="11.925" ry="11.85"/><text fill="#172033" x="370" y="224"><tspan>读取线程池（生产者）</tspan></text><text fill="#26354c" x="370" y="252"><tspan>封装 DataBatch 并入队</tspan></text><text fill="#46566c" x="370" y="281"><tspan>范围：min 2 ～ max (CPU / 2) × 1.5</tspan></text><text fill="#46566c" x="370" y="306"><tspan>快变量：每 10 秒自适应调整</tspan></text><rect fill="#fff7ed" stroke="#f97316" stroke-width="2.5" x="688" y="172" width="280" height="182" rx="11.2" ry="11.83"/><text fill="#172033" x="731" y="216"><tspan>交换队列</tspan></text><text fill="#26354c" x="724" y="245"><tspan>ArrayBlockingQueue&lt;DataBatch&gt;</tspan></text><text fill="#26354c" x="750" y="274"><tspan>固定容量：2048</tspan></text><text fill="#46566c" x="722" y="310"><tspan>有界阻塞：写满时反压读取端</tspan></text><text fill="#46566c" x="722" y="332"><tspan>水位 = 当前长度 / 2048</tspan></text><rect fill="#f0fdf4" stroke="#22c55e" stroke-width="2" x="1054" y="184" width="265" height="158" rx="11.925" ry="11.85"/><text fill="#172033" x="1087" y="224"><tspan>写入线程池（消费者）</tspan></text><text fill="#26354c" x="1087" y="252"><tspan>批量写入目标端</tspan></text><text fill="#46566c" x="1087" y="281"><tspan>范围：min 2 ～ max CPU × 2</tspan></text><text fill="#46566c" x="1087" y="306"><tspan>慢变量：每 2 分钟梯度探测</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="1365" y="204" width="70" height="118" rx="11.9" ry="11.8"/><text fill="#172033" x="1377" y="244"><tspan>目标</tspan></text><text fill="#172033" x="1377" y="267"><tspan>MongoDB</tspan></text><text fill="#46566c" x="1380" y="294"><tspan>bulk write</tspan></text><path fill="none" stroke="#334155" stroke-width="2.5" d="M 252 263 L 337 263" marker-end="url(#arrow)"/><path fill="none" stroke="#334155" stroke-width="2.5" d="M 602 263 L 688 263" marker-end="url(#arrow)"/><path fill="none" stroke="#334155" stroke-width="2.5" d="M 968 263 L 1054 263" marker-end="url(#arrow)"/><path fill="none" stroke="#334155" stroke-width="2.5" d="M 1319 263 L 1365 263" marker-end="url(#arrow)"/><line stroke="#e2e8f0" stroke-width="2" x1="40" y1="435" x2="1460" y2="435"/><text fill="#172033" x="48" y="478"><tspan>调优控制平面：队列水位形成负反馈，读写控制器无需显式同步</tspan></text><rect fill="#faf5ff" stroke="#a855f7" stroke-width="2" x="72" y="515" width="560" height="340" rx="14" ry="13.6"/><text fill="#172033" x="102" y="555"><tspan>读取线程水位控制器（快变量）</tspan></text><text fill="#26354c" x="102" y="582"><tspan>每 10 秒采样；将当前水位与最近两次采样取平均</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="102" y="614" width="500" height="151" rx="7.5" ry="8.305"/><text fill="#26354c" x="126" y="648"><tspan>平滑水位 &lt; 40%　→　读取线程数 +1（供给不足）</tspan></text><text fill="#26354c" x="126" y="684"><tspan>40% ≤ 平滑水位 ≤ 60%　→　保持不变（供需平衡）</tspan></text><text fill="#26354c" x="126" y="720"><tspan>平滑水位 &gt; 60%　→　读取线程数 -1（产生积压）</tspan></text><text fill="#46566c" x="126" y="748"><tspan>每次调整均受 min 2 / max (CPU / 2) × 1.5 硬边界约束</tspan></text><rect fill="#fff1f2" stroke="#f43f5e" stroke-width="2" x="102" y="786" width="500" height="42" rx="7.5" ry="7.98"/><text fill="#26354c" x="126" y="813"><tspan>紧急熔断：实时水位 &gt; 85% 时，立即强制读取线程数 -1</tspan></text><rect fill="#faf5ff" stroke="#a855f7" stroke-width="2" x="868" y="515" width="560" height="340" rx="14" ry="13.6"/><text fill="#172033" x="898" y="555"><tspan>写入线程梯度探测器（慢变量）</tspan></text><text fill="#26354c" x="898" y="582"><tspan>每 2 分钟触发；若仍在冷却期则跳过</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="898" y="614" width="500" height="214" rx="7.5" ry="8.56"/><text fill="#26354c" x="922" y="646"><tspan>1. 记录 n 线程最近 3 轮 × 1000 批平均耗时 T_old</tspan></text><text fill="#26354c" x="922" y="678"><tspan>2. 临时调整为 n+1，预热 30 秒</tspan></text><text fill="#26354c" x="922" y="710"><tspan>3. 执行 3 轮 × 1000 批，计算平均耗时 T_new</tspan></text><text fill="#26354c" x="922" y="748"><tspan>T_new ≤ T_old × 1.05：保留 n+1，冷却 2 分钟</tspan></text><text fill="#26354c" x="922" y="782"><tspan>T_new &gt; T_old × 1.05：回退 n，冷却 3 分钟</tspan></text><text fill="#46566c" x="922" y="810"><tspan>所有调整均受 min 2 / max CPU × 2 硬边界约束</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 828 354 L 828 480 L 352 480 L 352 515" marker-end="url(#feedbackArrow)"/><rect fill="#172033" x="580" y="453" width="184" height="26" rx="12.88" ry="13"/><text fill="#ffffff" x="602" y="471"><tspan>采样队列水位</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 352 515 L 470 342" marker-end="url(#feedbackArrow)"/><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 1186 515 L 1186 430 L 1186 342" marker-end="url(#feedbackArrow)"/><rect fill="#172033" x="1202" y="449" width="164" height="26" rx="12.3" ry="13"/><text fill="#ffffff" x="1221" y="467"><tspan>调整写入并发</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 1186 515 L 1186 342" marker-end="url(#feedbackArrow)"/><path fill="none" stroke="#e11d48" stroke-width="2.3" stroke-dasharray="6,5" d="M 828 354 L 828 410 L 252 410 L 252 184" marker-end="url(#safetyArrow)"/><rect fill="#e11d48" x="440" y="395" width="196" height="28" rx="13.72" ry="14"/><text fill="#ffffff" x="459" y="414"><tspan>水位 &gt; 85%：紧急减读</tspan></text><line stroke="#e2e8f0" stroke-width="2" x1="40" y1="898" x2="1460" y2="898"/><text fill="#172033" x="48" y="937"><tspan>协同关系</tspan></text><text fill="#26354c" x="48" y="966"><tspan>写入线程以 2 分钟频率探索目标端承载力；读取线程以 10 秒频率跟随队列水位，持续匹配实际消费能力。</tspan></text><text fill="#46566c" x="48" y="994"><tspan>安全优先级：线程数硬边界 ＞ 队列高水位紧急熔断 ＞ 常规水位调节 / 写入梯度探测。</tspan></text></svg>
