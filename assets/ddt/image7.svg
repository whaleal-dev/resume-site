<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" baseProfile="tiny" x="0" y="0" width="1700" height="1190" viewBox="0 0 1700 1190"><defs/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#334155" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker><marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker><marker id="safeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#e11d48" d="M 0 0 L 10 5 L 0 10 L 0 0 Z"/></marker></defs><rect fill="#ffffff" x="0" y="0" width="1700" height="1190"/><text fill="#172033" x="48" y="56"><tspan>DDT 实时同步实际数据流</tspan></text><text fill="#526074" x="48" y="84"><tspan>基于当前 realtime 源码：三层有界队列解耦，按集合串行解析，按桶并行写入。</tspan></text><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="120" width="1620" height="385" rx="8.1" ry="15.4"/><text fill="#172033" x="70" y="158"><tspan>主流水线</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="70" y="244" width="185" height="124" rx="11.1" ry="11.78"/><text fill="#172033" x="100" y="284"><tspan>源端 MongoDB</tspan></text><text fill="#344258" x="100" y="314"><tspan>持续产生变更</tspan></text><text fill="#526074" x="100" y="340"><tspan>Oplog 或 Change Stream</tspan></text><rect fill="#eff6ff" stroke="#3b82f6" stroke-width="2" x="320" y="220" width="220" height="172" rx="11" ry="11.18"/><text fill="#172033" x="350" y="260"><tspan>事件读取</tspan></text><text fill="#344258" x="350" y="290"><tspan>Oplog：持续追踪或区间回放</tspan></text><text fill="#344258" x="350" y="317"><tspan>Change Stream：监听变更</tspan></text><text fill="#526074" x="350" y="344"><tspan>过滤、延迟控制、记录内存时间位置</tspan></text><rect fill="#fff7ed" stroke="#f97316" stroke-width="2.2" x="605" y="232" width="190" height="148" rx="11.4" ry="11.84"/><text fill="#172033" x="635" y="272"><tspan>事件队列</tspan></text><text fill="#344258" x="635" y="302"><tspan>原始事件缓存</tspan></text><text fill="#526074" x="635" y="332"><tspan>有界阻塞</tspan></text><rect fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" x="860" y="220" width="225" height="172" rx="11.25" ry="11.18"/><text fill="#172033" x="890" y="260"><tspan>按集合解析和路由</tspan></text><text fill="#344258" x="890" y="290"><tspan>识别 CRUD、DDL 与命令事件</tspan></text><text fill="#526074" x="890" y="344"><tspan>新集合先获取唯一索引信息</tspan></text><rect fill="#fff7ed" stroke="#f97316" stroke-width="2.2" x="1150" y="232" width="190" height="148" rx="11.4" ry="11.84"/><text fill="#172033" x="1180" y="272"><tspan>集合队列</tspan></text><text fill="#344258" x="1180" y="302"><tspan>每个集合独立队列</tspan></text><text fill="#526074" x="1180" y="332"><tspan>有界阻塞</tspan></text><rect fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" x="1405" y="220" width="215" height="172" rx="11.825" ry="11.18"/><text fill="#172033" x="1435" y="260"><tspan>分桶转换</tspan></text><text fill="#344258" x="1435" y="290"><tspan>同一集合同一时刻仅一个解析线程</tspan></text><text fill="#526074" x="1435" y="317"><tspan>普通数据按 _id 哈希分桶</tspan></text><text fill="#526074" x="1435" y="344"><tspan>生成目标端写入批次</tspan></text><path fill="none" stroke="#334155" stroke-width="2.5" d="M 255 306 L 320 306 M 540 306 L 605 306 M 795 306 L 860 306 M 1085 306 L 1150 306 M 1340 306 L 1405 306" marker-end="url(#arrow)"/><rect fill="#172033" x="830" y="438" width="395" height="34" rx="15.8" ry="17"/><text fill="#ffffff" x="854" y="461"><tspan>三层队列均为有界阻塞：消费变慢时，背压逐级传回读取端</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 1245 380 L 1245 420 L 1028 420 L 1028 438" marker-end="url(#feedbackArrow)"/><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 700 380 L 700 420 L 1028 420" marker-end="url(#feedbackArrow)"/><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="545" width="1620" height="200" rx="8.1" ry="16"/><text fill="#172033" x="70" y="583"><tspan>桶级写入与顺序控制</tspan></text><rect fill="#fff7ed" stroke="#f97316" stroke-width="2.2" x="265" y="624" width="270" height="82" rx="10.8" ry="11.89"/><text fill="#172033" x="295" y="657"><tspan>写入桶队列</tspan></text><text fill="#344258" x="295" y="684"><tspan>按集合与分桶编号路由</tspan></text><rect fill="#f0fdf4" stroke="#22c55e" stroke-width="2" x="715" y="612" width="270" height="106" rx="10.8" ry="11.66"/><text fill="#172033" x="745" y="649"><tspan>按桶批量写入</tspan></text><text fill="#344258" x="745" y="677"><tspan>同一桶同一时刻仅一个写入线程</tspan></text><text fill="#526074" x="745" y="695"><tspan>***写入线程判断一批128条中是否含有_id重复</tspan></text><text fill="#526074" x="745" y="715"><tspan>普通集合无序批量；唯一索引集合有序批量</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="1165" y="624" width="270" height="82" rx="10.8" ry="11.89"/><text fill="#172033" x="1195" y="657"><tspan>目标端 MongoDB</tspan></text><text fill="#344258" x="1195" y="684"><tspan>执行数据与结构变更</tspan></text><path fill="none" stroke="#334155" stroke-width="2.5" d="M 1512 392 L 1512 578 L 400 578 L 400 624" marker-end="url(#arrow)"/><path fill="none" stroke="#334155" stroke-width="2.5" d="M 535 665 L 715 665 M 985 665 L 1165 665" marker-end="url(#arrow)"/><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="785" width="1620" height="276" rx="8.1" ry="15.18"/><text fill="#172033" x="70" y="823"><tspan>当前实现的特殊路径与保障</tspan></text><rect fill="#fff1f2" stroke="#f43f5e" stroke-width="2" x="80" y="862" width="350" height="154" rx="10.5" ry="11.55"/><text fill="#172033" x="110" y="900"><tspan>DDL：全局排空等待</tspan></text><text fill="#344258" x="110" y="928"><tspan>DDL 入集合队列前后均等待缓存排空</tspan></text><text fill="#344258" x="110" y="955"><tspan>检查全部集合队列与写入桶队列</tspan></text><text fill="#526074" x="110" y="982"><tspan>全局屏障</tspan></text><rect fill="#fff1f2" stroke="#f43f5e" stroke-width="2" x="500" y="862" width="350" height="154" rx="10.5" ry="11.55"/><text fill="#172033" x="530" y="900"><tspan>唯一索引：固定桶</tspan></text><text fill="#344258" x="530" y="928"><tspan>检测到唯一索引后，集合的变更进入固定路径</tspan></text><text fill="#344258" x="530" y="955"><tspan>同集合使用有序写入，降低并发冲突</tspan></text><text fill="#526074" x="530" y="982"><tspan>普通集合仍按 _id 哈希获得并行度</tspan></text><rect fill="#fff1f2" stroke="#f43f5e" stroke-width="2" x="920" y="862" width="350" height="154" rx="10.5" ry="11.55"/><text fill="#172033" x="950" y="900"><tspan>批量失败：逐条回退</tspan></text><text fill="#344258" x="950" y="928"><tspan>批量写入异常后，逐条有序重试一次</tspan></text><text fill="#344258" x="950" y="955"><tspan>单条仍失败则记录错误并继续</tspan></text><text fill="#526074" x="950" y="982"><tspan>当前没有持久化重试或死信队列</tspan></text><rect fill="#fefce8" stroke="#ca8a04" stroke-width="2" x="1340" y="862" width="280" height="154" rx="11.2" ry="11.55"/><text fill="#172033" x="1370" y="900"><tspan>状态与观测</tspan></text><text fill="#344258" x="1370" y="928"><tspan>统计缓存量、执行量和写入速率</tspan></text><text fill="#344258" x="1370" y="955"><tspan>读取结束或外部停止后退出</tspan></text><text fill="#526074" x="1370" y="982"><tspan>由任务编排层判断缓存收敛</tspan></text><path fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6,5" d="M 255 862 L 255 770 L 1245 770 L 1245 706" marker-end="url(#safeArrow)"/><path fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6,5" d="M 675 862 L 675 770 L 400 770 L 400 706" marker-end="url(#safeArrow)"/><path fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="6,5" d="M 1095 862 L 1095 770 L 850 770 L 850 718" marker-end="url(#safeArrow)"/><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 1480 862 L 1480 770 L 700 770 L 700 380" marker-end="url(#feedbackArrow)"/><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="1100" width="1620" height="54" rx="8.1" ry="13.77"/><text fill="#344258" x="70" y="1134"><tspan>实际设计取舍：普通集合通过文档哈希分桶提高吞吐；DDL场景以更严格的排空、有序策略换取一致性。</tspan></text></svg>
