<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" baseProfile="tiny" x="0" y="0" width="1680" height="1220" viewBox="0 0 1680 1220"><defs/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#334155" d="M 0 0 L 10 5 L 0 100 L 0 0 Z"/></marker><marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 100 L 0 0 Z"/></marker><marker id="safetyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#e11d48" d="M 0 0 L 10 5 L 0 100 L 0 0 Z"/></marker></defs><rect fill="#ffffff" x="0" y="0" width="1680" height="1220"/><text fill="#172033" x="48" y="56"><tspan>DDT 实时同步写入线程自适应扩缩容</tspan></text><text fill="#526074" x="48" y="84"><tspan>读取端由缓存水位背压保护；写入端以吞吐探测双向扩缩容，持续匹配当前流量与目标端承载力。</tspan></text><rect fill="#f8fafc" stroke="#dbe4ef" stroke-width="2" x="40" y="120" width="1600" height="250" rx="16" ry="15"/><text fill="#172033" x="70" y="158"><tspan>数据平面：读取端固定单线程，写入端动态并发</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="80" y="210" width="200" height="112" rx="12" ry="11.76"/><text fill="#172033" x="110" y="249"><tspan>源端 Change Stream</tspan></text><text fill="#344258" x="110" y="279"><tspan>持续输出变更事件</tspan></text><rect fill="#eff6ff" stroke="#3b82f6" stroke-width="2" x="375" y="190" width="260" height="152" rx="11.7" ry="11.4"/><text fill="#172033" x="407" y="230"><tspan>读取端：固定 1 线程</tspan></text><text fill="#344258" x="407" y="260"><tspan>单线程消费并写入缓存</tspan></text><text fill="#526074" x="407" y="289"><tspan>水位超限时暂停，水位恢复后继续</tspan></text><rect fill="#fff7ed" stroke="#f97316" stroke-width="2.5" x="730" y="177" width="260" height="178" rx="11.7" ry="11.57"/><text fill="#172033" x="762" y="217"><tspan>有界缓存队列</tspan></text><text fill="#344258" x="762" y="247"><tspan>缓冲读写速度差</tspan></text><text fill="#526074" x="762" y="278"><tspan>≥ 60%：暂停读取，形成背压</tspan></text><text fill="#526074" x="762" y="304"><tspan>&lt; 60%：恢复读取</tspan></text><rect fill="#f0fdf4" stroke="#22c55e" stroke-width="2" x="1085" y="190" width="260" height="152" rx="11.7" ry="11.4"/><text fill="#172033" x="1117" y="230"><tspan>写入端：动态线程池</tspan></text><text fill="#344258" x="1117" y="260"><tspan>并发消费缓存并批量写入</tspan></text><text fill="#526074" x="1117" y="289"><tspan>最小 2，最大 CPU 核数 × 2</tspan></text><rect fill="#ecfeff" stroke="#06b6d4" stroke-width="2" x="1440" y="210" width="160" height="112" rx="12" ry="11.76"/><text fill="#172033" x="1470" y="249"><tspan>目标端</tspan></text><text fill="#172033" x="1470" y="274"><tspan>MongoDB</tspan></text><text fill="#526074" x="1470" y="300"><tspan>批量写入</tspan></text><path fill="none" stroke="#334155" stroke-width="2.5" d="M 280 266 L 375 266 M 635 266 L 730 266 M 990 266 L 1085 266 M 1345 266 L 1440 266" marker-end="url(#arrow)"/><path fill="none" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="6,5" d="M 860 355 L 860 394 L 505 394 L 505 342" marker-end="url(#safetyArrow)"/><rect fill="#e11d48" x="580" y="380" width="304" height="28" rx="13.68" ry="14"/><text fill="#ffffff" x="604" y="399"><tspan>缓存 ≥ 60%：暂停读取，避免缓存持续堆积</tspan></text><line stroke="#dbe4ef" stroke-width="2" x1="40" y1="440" x2="1640" y2="440"/><text fill="#172033" x="48" y="482"><tspan>每 2 分钟自检：缓存水位决定扩缩容方向（扩容与缩容互斥）</tspan></text><rect fill="#eff6ff" stroke="#3b82f6" stroke-width="2" x="75" y="525" width="430" height="128" rx="12.9" ry="13.44"/><text fill="#172033" x="105" y="565"><tspan>低水位：触发缩容探测</tspan></text><text fill="#344258" x="105" y="595"><tspan>缓存 &lt; 20%，且持续超过 2 分钟</tspan></text><text fill="#526074" x="105" y="622"><tspan>前提：当前写入线程数 &gt; 2</tspan></text><rect fill="#f0fdf4" stroke="#22c55e" stroke-width="2" x="625" y="525" width="430" height="128" rx="12.9" ry="13.44"/><text fill="#172033" x="655" y="565"><tspan>稳定区：保持当前并发</tspan></text><text fill="#344258" x="655" y="595"><tspan>20% ≤ 缓存使用率 &lt; 60%</tspan></text><text fill="#526074" x="655" y="622"><tspan>不扩容、不缩容</tspan></text><rect fill="#fff1f2" stroke="#f43f5e" stroke-width="2" x="1175" y="525" width="430" height="128" rx="12.9" ry="13.44"/><text fill="#172033" x="1205" y="565"><tspan>高水位：触发扩容探测</tspan></text><text fill="#344258" x="1205" y="595"><tspan>缓存使用率 ≥ 60%</tspan></text><text fill="#526074" x="1205" y="622"><tspan>前提：当前写入线程数 &lt; CPU 核数 × 2</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 860 355 L 860 477 L 290 477 L 290 525" marker-end="url(#feedbackArrow)"/><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 860 355 L 860 477 L 840 477 L 840 525" marker-end="url(#feedbackArrow)"/><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,6" d="M 860 355 L 860 477 L 1390 477 L 1390 525" marker-end="url(#feedbackArrow)"/><rect fill="#172033" x="756" y="462" width="210" height="28" rx="13.65" ry="14"/><text fill="#ffffff" x="782" y="481"><tspan>读取缓存水位</tspan></text><rect fill="#eff6ff" stroke="#3b82f6" stroke-width="2" x="75" y="703" width="430" height="60" rx="15.05" ry="15.9"/><text fill="#172033" x="105" y="743"><tspan>写入线程数 n → n - 1</tspan></text><rect fill="#fff1f2" stroke="#f43f5e" stroke-width="2" x="905" y="703" width="700" height="338" rx="14" ry="15.21"/><text fill="#172033" x="935" y="743"><tspan>扩容探测：n → n + 1</tspan></text><text fill="#344258" x="935" y="775"><tspan>1. 记录 n 线程完成 100 万条写入的平均耗时 T_old</tspan></text><text fill="#344258" x="935" y="807"><tspan>2. 临时增加 1 个线程，预热 30 秒</tspan></text><text fill="#344258" x="935" y="839"><tspan>3. 记录 n + 1 线程完成 100 万条写入的平均耗时 T_new</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="935" y="871" width="640" height="64" rx="9.6" ry="9.92"/><text fill="#344258" x="962" y="899"><tspan>T_new ≤ T_old × 1.05：保留 n + 1，允许后续继续扩容</tspan></text><text fill="#344258" x="962" y="924"><tspan>T_new &gt; T_old × 1.05：回退 n，停止本轮扩容</tspan></text><path fill="none" stroke="#334155" stroke-width="2.5" d="M 290 653 L 290 703" marker-end="url(#arrow)"/><path fill="none" stroke="#334155" stroke-width="2.5" d="M 1390 653 L 1390 703" marker-end="url(#arrow)"/><rect fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" x="40" y="1080" width="1600" height="76" rx="16" ry="15.96"/><text fill="#172033" x="70" y="1114"><tspan>闭环效果</tspan></text><text fill="#344258" x="70" y="1141"><tspan>写入不足时缓存升高，读取暂停并触发扩容；写入富余时缓存长期低位，触发缩容；缓存稳定在 20% ～ 60% 时维持当前并发。</tspan></text></svg>
