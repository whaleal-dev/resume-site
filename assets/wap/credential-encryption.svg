<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
  <title id="title">WAP 敏感配置信息加密流程</title>
  <desc id="desc">展示 Kubernetes、AWS 和 S3 敏感配置从管理员提交、权限及连通性校验、加密存储，到按需解密调用和脱敏审计的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .stage { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .box { stroke-width: 1.5; rx: 12; }
      .user { fill: #e0f2fe; stroke: #0ea5e9; }
      .gateway { fill: #dbeafe; stroke: #2563eb; }
      .check { fill: #fef3c7; stroke: #d97706; }
      .crypto { fill: #ede9fe; stroke: #7c3aed; }
      .store { fill: #dcfce7; stroke: #16a34a; }
      .runtime { fill: #ffedd5; stroke: #ea580c; }
      .audit { fill: #f1f5f9; stroke: #64748b; }
      .title { font: 700 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; text-anchor: middle; }
      .sub { font: 12px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .stage-title { font: 700 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .main-title { font: 700 24px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .note { font: 12px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; text-anchor: middle; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .success { fill: none; stroke: #16a34a; stroke-width: 2; marker-end: url(#green-arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1440" height="830"/>
  <text class="main-title" x="720" y="42">WAP 敏感配置信息加密与按需使用</text>
  <text class="note" x="720" y="67">配置不明文落库，凭据仅在授权业务调用期间于服务端内存中短暂解密</text>

  <rect class="stage" x="40" y="95" width="1360" height="188" rx="14"/>
  <text class="stage-title" x="68" y="125">1. 提交、校验与加密存储</text>
  <rect class="box user" x="90" y="158" width="230" height="80"/>
  <text class="title" x="205" y="188">管理员提交配置</text>
  <text class="sub" x="205" y="211">kubeconfig、AWS/S3 凭据</text>
  <rect class="box gateway" x="405" y="147" width="235" height="102"/>
  <text class="title" x="522" y="177">服务端权限校验</text>
  <text class="sub" x="522" y="200">校验 whaleal-token 与管理员角色</text>
  <text class="sub" x="522" y="221">传输中字段仅临时解密</text>
  <rect class="box check" x="725" y="147" width="250" height="102"/>
  <text class="title" x="850" y="177">连通性与格式校验</text>
  <text class="sub" x="850" y="200">AWS API、S3 或 K8s Namespace</text>
  <text class="sub" x="850" y="221">失败不写入配置记录</text>
  <rect class="box crypto" x="1060" y="147" width="250" height="102"/>
  <text class="title" x="1185" y="177">字段加密后持久化</text>
  <text class="sub" x="1185" y="200">配置记录 ID 作为加密上下文</text>
  <text class="sub" x="1185" y="221">密文 Base64 保存至 MongoDB</text>
  <path class="flow" d="M320,198 H388"/>
  <path class="flow" d="M640,198 H708"/>
  <path class="success" d="M975,198 H1043"/>

  <rect class="stage" x="40" y="313" width="1360" height="220" rx="14"/>
  <text class="stage-title" x="68" y="343">2. 按需解密与外部资源调用</text>
  <rect class="box store" x="100" y="391" width="270" height="90"/>
  <text class="title" x="235" y="421">MongoDB 密文配置</text>
  <text class="sub" x="235" y="444">仅保存密文、配置 ID 和非敏感元数据</text>
  <text class="sub" x="235" y="465">不保存可直接使用的明文 Secret</text>
  <rect class="box crypto" x="510" y="391" width="260" height="90"/>
  <text class="title" x="640" y="421">受控服务进程临时解密</text>
  <text class="sub" x="640" y="444">按配置 ID 解密到短生命周期内存</text>
  <text class="sub" x="640" y="465">禁止写入日志、事件或响应</text>
  <rect class="box runtime" x="910" y="391" width="330" height="90"/>
  <text class="title" x="1075" y="421">构造客户端并执行授权调用</text>
  <text class="sub" x="1075" y="444">Kubernetes API、AWS SDK、S3 或备份服务</text>
  <text class="sub" x="1075" y="465">仅返回资源状态和业务结果</text>
  <path class="flow" d="M370,436 H493"/>
  <path class="flow" d="M770,436 H893"/>
  <path class="dash" d="M1075,481 V505 H235 V481"/>
  <text class="note" x="650" y="518">调用完成后不持久化明文；页面和日志只展示脱敏摘要</text>

  <rect class="stage" x="40" y="563" width="1360" height="215" rx="14"/>
  <text class="stage-title" x="68" y="593">3. 安全边界与生产强化</text>
  <rect class="box audit" x="110" y="640" width="260" height="88"/>
  <text class="title" x="240" y="670">最小权限与脱敏</text>
  <text class="sub" x="240" y="693">管理员配置、云 IAM 最小授权</text>
  <text class="sub" x="240" y="714">接口与日志不回显 Secret</text>
  <rect class="box audit" x="475" y="640" width="260" height="88"/>
  <text class="title" x="605" y="670">审计与告警</text>
  <text class="sub" x="605" y="693">记录凭据引用和操作结果</text>
  <text class="sub" x="605" y="714">解密失败与异常读取告警</text>
  <rect class="box crypto" x="840" y="640" width="380" height="88"/>
  <text class="title" x="1030" y="670">生产目标：KMS 信封加密</text>
  <text class="sub" x="1030" y="693">AES-GCM、随机 IV、keyVersion 与密钥轮换</text>
  <text class="sub" x="1030" y="714">认证失败立即拒绝，不允许明文回退</text>
  <path class="dash" d="M235,640 V580 H1075 V481"/>
  <path class="dash" d="M605,640 V600 H1075 V481"/>
</svg>
