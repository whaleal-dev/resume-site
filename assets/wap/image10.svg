<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" baseProfile="tiny" x="0" y="0" width="1440" height="980" viewBox="0 0 1440 980"><defs/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#475569" d="M 0 0 L 0 6 L 9 3 L 0 0 Z"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#16a34a" d="M 0 0 L 0 6 L 9 3 L 0 0 Z"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#dc2626" d="M 0 0 L 0 6 L 9 3 L 0 0 Z"/></marker></defs><rect fill="#f8fafc" x="0" y="0" width="1440" height="900"/><text fill="#0f172a" text-anchor="middle" x="720" y="42"><tspan>WAP 事件组：异步运维任务的可控编排</tspan></text><text fill="#64748b" text-anchor="middle" x="720" y="67"><tspan>以同一个 eventId 串联任务、命令、日志、人工干预和最终状态</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="40" y="95" width="1360" height="175" rx="13.6" ry="14"/><text fill="#334155" x="68" y="125"><tspan>1. 建档与集群互斥</tspan></text><rect fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5" x="95" y="153" width="220" height="74"/><text fill="#1e293b" text-anchor="middle" x="205" y="182"><tspan>用户提交运维请求</tspan></text><text fill="#475569" text-anchor="middle" x="205" y="205"><tspan>创建、备份、恢复或变更</tspan></text><rect fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" x="415" y="142" width="270" height="96"/><text fill="#1e293b" text-anchor="middle" x="550" y="172"><tspan>创建事件组 EventLog</tspan></text><text fill="#475569" text-anchor="middle" x="550" y="195"><tspan>生成 eventId，记录集群、操作人</tspan></text><text fill="#475569" text-anchor="middle" x="550" y="216"><tspan>状态：Init -&gt; Running</tspan></text><rect fill="#fef3c7" stroke="#d97706" stroke-width="1.5" x="790" y="142" width="250" height="96"/><text fill="#1e293b" text-anchor="middle" x="915" y="172"><tspan>获取集群互斥锁</tspan></text><text fill="#475569" text-anchor="middle" x="915" y="195"><tspan>eventLock 对 clusterId 唯一</tspan></text><text fill="#475569" text-anchor="middle" x="915" y="216"><tspan>冲突等待，超时则异常结束</tspan></text><rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" x="1140" y="153" width="205" height="74"/><text fill="#1e293b" text-anchor="middle" x="1242" y="182"><tspan>后台任务启动</tspan></text><text fill="#475569" text-anchor="middle" x="1242" y="205"><tspan>接口立即返回 eventId</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 315 190 L 398 190" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 685 190 L 773 190" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1040 190 L 1123 190" marker-end="url(#arrow)"/><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="40" y="300" width="1360" height="295" rx="13.6" ry="13.275"/><text fill="#334155" x="68" y="330"><tspan>2. 步骤执行、命令回执与日志汇总</tspan></text><rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" x="115" y="360" width="260" height="94"/><text fill="#1e293b" text-anchor="middle" x="245" y="399"><tspan>执行编排步骤</tspan></text><text fill="#475569" text-anchor="middle" x="245" y="422"><tspan>资源准备、拓扑初始化、校验</tspan></text><text fill="#475569" text-anchor="middle" x="245" y="443"><tspan>每一步写入 eventId 日志</tspan></text><rect fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" x="435" y="360" width="255" height="94"/><text fill="#1e293b" text-anchor="middle" x="562" y="389"><tspan>创建 CommandEntity</tspan></text><text fill="#475569" text-anchor="middle" x="562" y="412"><tspan>绑定 hostId、eventId、命令类型和内容</tspan></text><text fill="#475569" text-anchor="middle" x="562" y="433"><tspan>持久化后状态：已下发未响应</tspan></text><rect fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" x="800" y="360" width="230" height="94"/><text fill="#1e293b" text-anchor="middle" x="915" y="389"><tspan>Agent 拉取并执行</tspan></text><text fill="#475569" text-anchor="middle" x="915" y="412"><tspan>GET 拉取本机待执行命令</tspan></text><text fill="#475569" text-anchor="middle" x="915" y="433"><tspan>确认入队，调用对应执行器</tspan></text><rect fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" x="1140" y="360" width="210" height="94"/><text fill="#1e293b" text-anchor="middle" x="1245" y="389"><tspan>回传与事件汇总</tspan></text><text fill="#475569" text-anchor="middle" x="1245" y="412"><tspan>PUT 状态、结果和更新时间</tspan></text><text fill="#475569" text-anchor="middle" x="1245" y="433"><tspan>与 EventLog 合并为时间线</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 375 407 L 418 407" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 800 407 L 707 407" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1030 407 L 1123 407" marker-end="url(#arrow)"/><path fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,5" d="M 1245 360 L 1245 345 L 245 345 L 245 360" marker-end="url(#arrow)"/><text fill="#64748b" text-anchor="middle" x="770" y="348"><tspan>编排线程轮询同一 eventId 下的命令状态，并检测暂停或终止信号</tspan></text><text fill="#64748b" text-anchor="middle" x="100" y="492"><tspan>命令生命周期</tspan></text><rect fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" x="195" y="470" width="205" height="66"/><text fill="#1e293b" text-anchor="middle" x="297" y="496"><tspan>1. 已下发未响应</tspan></text><text fill="#475569" text-anchor="middle" x="297" y="518"><tspan>等待目标 Agent 拉取</tspan></text><rect fill="#fef3c7" stroke="#d97706" stroke-width="1.5" x="475" y="470" width="205" height="66"/><text fill="#1e293b" text-anchor="middle" x="577" y="496"><tspan>2. 已响应执行中</tspan></text><text fill="#475569" text-anchor="middle" x="577" y="518"><tspan>Agent 已确认并进入队列</tspan></text><rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" x="755" y="470" width="205" height="66"/><text fill="#1e293b" text-anchor="middle" x="857" y="496"><tspan>3. 执行成功</tspan></text><text fill="#475569" text-anchor="middle" x="857" y="518"><tspan>结果写入命令与事件日志</tspan></text><rect fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" x="1035" y="470" width="260" height="66"/><text fill="#1e293b" text-anchor="middle" x="1165" y="496"><tspan>执行失败、无响应或超时</tspan></text><text fill="#475569" text-anchor="middle" x="1165" y="518"><tspan>记录错误，事件组转入 Pause</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 400 503 L 458 503" marker-end="url(#arrow)"/><path fill="none" stroke="#16a34a" stroke-width="2" d="M 680 503 L 738 503" marker-end="url(#green-arrow)"/><path fill="none" stroke="#dc2626" stroke-width="2" d="M 680 527 L 680 555 L 1165 555 L 1165 543" marker-end="url(#red-arrow)"/><path fill="none" stroke="#dc2626" stroke-width="2" d="M 960 503 L 1018 503" marker-end="url(#red-arrow)"/><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="40" y="625" width="1360" height="295" rx="13.6" ry="13.275"/><text fill="#334155" x="68" y="655"><tspan>3. 状态机、人工干预与结束</tspan></text><rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" x="100" y="722" width="215" height="82"/><text fill="#1e293b" text-anchor="middle" x="207" y="752"><tspan>Running</tspan></text><text fill="#475569" text-anchor="middle" x="207" y="775"><tspan>等待全部命令与步骤完成</tspan></text><rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" x="480" y="705" width="225" height="82"/><text fill="#1e293b" text-anchor="middle" x="592" y="735"><tspan>Closed</tspan></text><text fill="#475569" text-anchor="middle" x="592" y="758"><tspan>全部成功，释放集群锁</tspan></text><rect fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" x="480" y="825" width="225" height="82"/><text fill="#1e293b" text-anchor="middle" x="592" y="855"><tspan>Pause</tspan></text><text fill="#475569" text-anchor="middle" x="592" y="878"><tspan>失败或超时，等待人工处理</tspan></text><rect fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" x="865" y="705" width="225" height="82"/><text fill="#1e293b" text-anchor="middle" x="977" y="735"><tspan>继续执行</tspan></text><text fill="#475569" text-anchor="middle" x="977" y="758"><tspan>失败命令标记为可继续</tspan></text><rect fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" x="1130" y="825" width="215" height="82"/><text fill="#1e293b" text-anchor="middle" x="1237" y="855"><tspan>Abort / Exception</tspan></text><text fill="#475569" text-anchor="middle" x="1237" y="878"><tspan>终止或暂停超时，释放锁</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" d="M 315 743 L 463 743" marker-end="url(#green-arrow)"/><text fill="#64748b" text-anchor="middle" x="389" y="729"><tspan>全部成功</tspan></text><path fill="none" stroke="#dc2626" stroke-width="2" d="M 207 804 L 207 866 L 463 866" marker-end="url(#red-arrow)"/><text fill="#64748b" text-anchor="middle" x="335" y="858"><tspan>命令失败或超时</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" d="M 705 866 L 790 866 L 790 746 L 848 746" marker-end="url(#green-arrow)"/><text fill="#64748b" text-anchor="middle" x="790" y="826"><tspan>人工继续</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" d="M 865 746 L 332 746 L 332 763" marker-end="url(#green-arrow)"/><path fill="none" stroke="#dc2626" stroke-width="2" d="M 705 866 L 1113 866" marker-end="url(#red-arrow)"/><text fill="#64748b" text-anchor="middle" x="909" y="858"><tspan>人工终止或暂停超时</tspan></text></svg>
