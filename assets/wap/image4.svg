<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" baseProfile="tiny" x="0" y="0" width="1440" height="1020" viewBox="0 0 1440 1020"><defs/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#475569" d="M 0 0 L 0 6 L 9 3 L 0 0 Z"/></marker><marker id="aws-arrow" viewBox="0 0 10 10" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#b45309" d="M 0 0 L 0 6 L 9 3 L 0 0 Z"/></marker></defs><rect fill="#f8fafc" x="0" y="0" width="1440" height="1020"/><text fill="#0f172a" text-anchor="middle" x="720" y="38"><tspan>WAP AWS EC2 首次编排流程</tspan></text><text fill="#64748b" text-anchor="middle" x="720" y="63"><tspan>前置校验 → 私网网络准备 → 节点展开 → EC2/EBS → User Data → Agent 验证</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="92" width="1356" height="138" rx="13.56" ry="13.8"/><text fill="#334155" x="68" y="121"><tspan>1. 前置校验</tspan></text><circle fill="#0ea5e9" cx="185" cy="163" r="17"/><text fill="#ffffff" text-anchor="middle" x="185" y="168"><tspan>1</tspan></text><rect fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" x="220" y="130" width="255" height="70"/><text fill="#1e293b" text-anchor="middle" x="347" y="158"><tspan>AWS 凭证验证</tspan></text><text fill="#475569" text-anchor="middle" x="347" y="181"><tspan>调用 EC2 API；成功后加密保存</tspan></text><circle fill="#0ea5e9" cx="595" cy="163" r="17"/><text fill="#ffffff" text-anchor="middle" x="595" y="168"><tspan>2</tspan></text><rect fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" x="630" y="130" width="255" height="70"/><text fill="#1e293b" text-anchor="middle" x="757" y="158"><tspan>项目与配额检查</tspan></text><text fill="#475569" text-anchor="middle" x="757" y="181"><tspan>AWS 项目、区域、EC2/EBS/VPC/TGW 配额</tspan></text><circle fill="#0ea5e9" cx="1005" cy="163" r="17"/><text fill="#ffffff" text-anchor="middle" x="1005" y="168"><tspan>3</tspan></text><rect fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" x="1040" y="130" width="290" height="70"/><text fill="#1e293b" text-anchor="middle" x="1185" y="158"><tspan>创建异步任务</tspan></text><text fill="#475569" text-anchor="middle" x="1185" y="181"><tspan>clusterId、eventId、集群规格与资源绑定</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 475 165 L 578 165" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 885 165 L 988 165" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1185 200 L 1185 242 L 302 242 L 302 320" marker-end="url(#arrow)"/><text fill="#475569" text-anchor="middle" x="760" y="235"><tspan>后台任务开始首次网络编排</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="254" width="1356" height="228" rx="13.56" ry="13.68"/><text fill="#334155" x="68" y="283"><tspan>2. 首次网络准备（目标 AWS 区域）</tspan></text><circle fill="#f97316" cx="150" cy="364" r="17"/><text fill="#ffffff" text-anchor="middle" x="150" y="369"><tspan>4</tspan></text><rect fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" x="185" y="320" width="235" height="90"/><text fill="#1e293b" text-anchor="middle" x="302" y="348"><tspan>创建 wap-vpc</tspan></text><text fill="#475569" text-anchor="middle" x="302" y="371"><tspan>分配不重叠的 CIDR</tspan></text><text fill="#475569" text-anchor="middle" x="302" y="391"><tspan>开启 VPC DNS</tspan></text><circle fill="#f97316" cx="502" cy="364" r="17"/><text fill="#ffffff" text-anchor="middle" x="502" y="369"><tspan>5</tspan></text><rect fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" x="537" y="320" width="290" height="90"/><text fill="#1e293b" text-anchor="middle" x="682" y="348"><tspan>逐可用区创建子网</tspan></text><text fill="#475569" text-anchor="middle" x="682" y="371"><tspan>AZ-1/2/3 → wap-subnet-1/2/3</tspan></text><text fill="#475569" text-anchor="middle" x="682" y="391"><tspan>查询、创建、校验、回填 subnetId</tspan></text><circle fill="#f97316" cx="910" cy="364" r="17"/><text fill="#ffffff" text-anchor="middle" x="910" y="369"><tspan>6</tspan></text><rect fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" x="945" y="320" width="355" height="90"/><text fill="#1e293b" text-anchor="middle" x="1122" y="348"><tspan>创建访问与私网互通资源</tspan></text><text fill="#475569" text-anchor="middle" x="1122" y="371"><tspan>Security Group、wap-key-&lt;region&gt;、wap-TGW</tspan></text><text fill="#475569" text-anchor="middle" x="1122" y="391"><tspan>VPC Attachment、路由；跨区域则 TGW Peering</tspan></text><path fill="none" stroke="#b45309" stroke-width="2" d="M 420 365 L 485 365" marker-end="url(#aws-arrow)"/><path fill="none" stroke="#b45309" stroke-width="2" d="M 827 365 L 893 365" marker-end="url(#aws-arrow)"/><text fill="#475569" text-anchor="middle" x="682" y="443"><tspan>multiZone=true：节点依次轮转子网；false：全部使用第一个子网</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 1122 410 L 1122 525 L 327 525 L 327 570" marker-end="url(#arrow)"/><text fill="#475569" text-anchor="middle" x="724" y="518"><tspan>网络参数完成后生成每台主机的创建参数</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="506" width="1356" height="202" rx="13.56" ry="13.13"/><text fill="#334155" x="68" y="535"><tspan>3. 节点展开与 EC2/EBS 编排</tspan></text><circle fill="#d97706" cx="160" cy="620" r="17"/><text fill="#ffffff" text-anchor="middle" x="160" y="625"><tspan>7</tspan></text><rect fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" x="195" y="570" width="265" height="98"/><text fill="#1e293b" text-anchor="middle" x="327" y="598"><tspan>展开节点清单</tspan></text><text fill="#475569" text-anchor="middle" x="327" y="621"><tspan>副本集：按 nodeNum</tspan></text><text fill="#475569" text-anchor="middle" x="327" y="642"><tspan>分片：每分片 3 节点 + 3 个 Config</tspan></text><circle fill="#d97706" cx="548" cy="620" r="17"/><text fill="#ffffff" text-anchor="middle" x="548" y="625"><tspan>8</tspan></text><rect fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" x="583" y="570" width="315" height="98"/><text fill="#1e293b" text-anchor="middle" x="740" y="598"><tspan>RunInstances 创建 EC2</tspan></text><text fill="#475569" text-anchor="middle" x="740" y="621"><tspan>AMI、实例类型、子网、安全组、密钥对</tspan></text><text fill="#475569" text-anchor="middle" x="740" y="642"><tspan>禁用公网 IP；根卷 50 GiB gp3</tspan></text><circle fill="#d97706" cx="986" cy="620" r="17"/><text fill="#ffffff" text-anchor="middle" x="986" y="625"><tspan>9</tspan></text><rect fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" x="1021" y="570" width="295" height="98"/><text fill="#1e293b" text-anchor="middle" x="1168" y="598"><tspan>创建并附加 EBS</tspan></text><text fill="#475569" text-anchor="middle" x="1168" y="621"><tspan>同可用区创建指定容量、类型和 IOPS</tspan></text><text fill="#475569" text-anchor="middle" x="1168" y="642"><tspan>等待 AVAILABLE → 挂载为 /dev/sdf</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 460 620 L 531 620" marker-end="url(#arrow)"/><path fill="none" stroke="#b45309" stroke-width="2" d="M 898 620 L 969 620" marker-end="url(#aws-arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1168 668 L 1168 772 L 380 772 L 380 796" marker-end="url(#arrow)"/><text fill="#475569" text-anchor="middle" x="780" y="764"><tspan>EC2 运行且数据卷已附加后执行 User Data</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="732" width="1356" height="222" rx="13.56" ry="13.32"/><text fill="#334155" x="68" y="761"><tspan>4. 实例初始化与就绪验证</tspan></text><circle fill="#16a34a" cx="170" cy="847" r="17"/><text fill="#ffffff" text-anchor="middle" x="170" y="852"><tspan>10</tspan></text><rect fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" x="205" y="796" width="350" height="108"/><text fill="#1e293b" text-anchor="middle" x="380" y="824"><tspan>EC2 User Data</tspan></text><text fill="#475569" text-anchor="middle" x="380" y="847"><tspan>等待 /dev/sdf → XFS 格式化 → 挂载 /data</tspan></text><text fill="#475569" text-anchor="middle" x="380" y="868"><tspan>写入 fstab；下载 JDK 17 与 Agent 包</tspan></text><text fill="#475569" text-anchor="middle" x="380" y="888"><tspan>写入网关与 Agent 参数，启动 Agent</tspan></text><circle fill="#16a34a" cx="705" cy="847" r="17"/><text fill="#ffffff" text-anchor="middle" x="705" y="852"><tspan>11</tspan></text><rect fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" x="740" y="796" width="310" height="108"/><text fill="#1e293b" text-anchor="middle" x="895" y="824"><tspan>Agent 注册验证</tspan></text><text fill="#475569" text-anchor="middle" x="895" y="847"><tspan>按实例 ID 轮询 Agent 注册记录</tspan></text><text fill="#475569" text-anchor="middle" x="895" y="868"><tspan>上限：min(节点数 × 5 分钟, 40 分钟)</tspan></text><text fill="#475569" text-anchor="middle" x="895" y="888"><tspan>成功后写入 hostId 与节点映射</tspan></text><circle fill="#16a34a" cx="1180" cy="847" r="17"/><text fill="#ffffff" text-anchor="middle" x="1180" y="852"><tspan>12</tspan></text><rect fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" x="1215" y="796" width="130" height="108"/><text fill="#1e293b" text-anchor="middle" x="1280" y="824"><tspan>结果处理</tspan></text><text fill="#475569" text-anchor="middle" x="1280" y="847"><tspan>成功：进入</tspan></text><text fill="#475569" text-anchor="middle" x="1280" y="866"><tspan>MongoDB 初始化</tspan></text><text fill="#475569" text-anchor="middle" x="1280" y="888"><tspan>失败：清理 EC2/EBS</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 555 850 L 688 850" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1050 850 L 1163 850" marker-end="url(#arrow)"/></svg>
