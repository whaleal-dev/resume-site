<?xml version="1.0" encoding="UTF-8" standalone="yes"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" baseProfile="tiny" x="0" y="0" width="1440" height="1020" viewBox="0 0 1440 1020"><defs/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#475569" d="M 0 0 L 0 6 L 9 3 L 0 0 Z"/></marker><marker id="k8s-arrow" viewBox="0 0 10 10" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path fill="#2563eb" d="M 0 0 L 0 6 L 9 3 L 0 0 Z"/></marker></defs><rect fill="#f8fafc" x="0" y="0" width="1440" height="1020"/><text fill="#0f172a" text-anchor="middle" x="720" y="38"><tspan>WAP 使用 Kubernetes 创建 MongoDB 集群</tspan></text><text fill="#64748b" text-anchor="middle" x="720" y="63"><tspan>Kubernetes 创建稳定 Agent 执行面，WAP 在 Agent 就绪后初始化 MongoDB 拓扑</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="92" width="1356" height="140" rx="13.56" ry="14"/><text fill="#334155" x="68" y="122"><tspan>1. 接入与前置校验</tspan></text><circle fill="#0ea5e9" cx="177" cy="165" r="17"/><text fill="#ffffff" text-anchor="middle" x="177" y="170"><tspan>1</tspan></text><rect fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" x="212" y="130" width="270" height="72"/><text fill="#1e293b" text-anchor="middle" x="347" y="158"><tspan>管理员接入 Kubernetes</tspan></text><text fill="#475569" text-anchor="middle" x="347" y="181"><tspan>保存 kubeconfig、集群类型与认证配置</tspan></text><circle fill="#0ea5e9" cx="596" cy="165" r="17"/><text fill="#ffffff" text-anchor="middle" x="596" y="170"><tspan>2</tspan></text><rect fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" x="631" y="130" width="285" height="72"/><text fill="#1e293b" text-anchor="middle" x="773" y="158"><tspan>WAP 创建 API Client</tspan></text><text fill="#475569" text-anchor="middle" x="773" y="181"><tspan>校验 RBAC、配额、镜像与网关可达性</tspan></text><circle fill="#0ea5e9" cx="1030" cy="165" r="17"/><text fill="#ffffff" text-anchor="middle" x="1030" y="170"><tspan>3</tspan></text><rect fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" x="1065" y="130" width="270" height="72"/><text fill="#1e293b" text-anchor="middle" x="1200" y="158"><tspan>提交 Agent Pod 集群</tspan></text><text fill="#475569" text-anchor="middle" x="1200" y="181"><tspan>生成 agentId、eventId 与 Namespace 项目</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 482 166 L 579 166" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 916 166 L 1013 166" marker-end="url(#arrow)"/><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="258" width="1356" height="206" rx="13.56" ry="13.39"/><text fill="#334155" x="68" y="288"><tspan>2. Kubernetes 执行面编排</tspan></text><circle fill="#2563eb" cx="145" cy="359" r="17"/><text fill="#ffffff" text-anchor="middle" x="145" y="364"><tspan>4</tspan></text><rect fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" x="180" y="313" width="250" height="94"/><text fill="#1e293b" text-anchor="middle" x="305" y="342"><tspan>准备基础资源</tspan></text><text fill="#475569" text-anchor="middle" x="305" y="365"><tspan>Namespace、standard StorageClass</tspan></text><text fill="#475569" text-anchor="middle" x="305" y="386"><tspan>Headless Service: whaleal-service</tspan></text><circle fill="#2563eb" cx="518" cy="359" r="17"/><text fill="#ffffff" text-anchor="middle" x="518" y="364"><tspan>5</tspan></text><rect fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" x="553" y="313" width="310" height="94"/><text fill="#1e293b" text-anchor="middle" x="708" y="342"><tspan>创建 StatefulSet</tspan></text><text fill="#475569" text-anchor="middle" x="708" y="365"><tspan>replicas、CPU/内存 requests 与 limits</tspan></text><text fill="#475569" text-anchor="middle" x="708" y="386"><tspan>whaleal/whaleal-agent:latest</tspan></text><circle fill="#2563eb" cx="951" cy="359" r="17"/><text fill="#ffffff" text-anchor="middle" x="951" y="364"><tspan>6</tspan></text><rect fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" x="986" y="313" width="315" height="94"/><text fill="#1e293b" text-anchor="middle" x="1143" y="342"><tspan>创建稳定 Pod 与独立 PVC</tspan></text><text fill="#475569" text-anchor="middle" x="1143" y="365"><tspan>hostName-0 ... hostName-(N-1)</tspan></text><text fill="#475569" text-anchor="middle" x="1143" y="386"><tspan>RWO / pvc-agent-vol /data</tspan></text><path fill="none" stroke="#2563eb" stroke-width="2" d="M 430 360 L 501 360" marker-end="url(#k8s-arrow)"/><path fill="none" stroke="#2563eb" stroke-width="2" d="M 863 360 L 934 360" marker-end="url(#k8s-arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1200 202 L 1200 274 L 305 274 L 305 313" marker-end="url(#arrow)"/><text fill="#475569" text-anchor="middle" x="753" y="266"><tspan>后台顺序调用 Kubernetes API</tspan></text><text fill="#475569" text-anchor="middle" x="708" y="438"><tspan>AWS 类型 Pod 使用 privileged: true；GKE 不由 WAP 创建 StorageClass</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="490" width="1356" height="212" rx="13.56" ry="13.78"/><text fill="#334155" x="68" y="520"><tspan>3. Agent 注册与 Pod 就绪验证</tspan></text><circle fill="#9333ea" cx="170" cy="602" r="17"/><text fill="#ffffff" text-anchor="middle" x="170" y="607"><tspan>7</tspan></text><rect fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" x="205" y="550" width="350" height="105"/><text fill="#1e293b" text-anchor="middle" x="380" y="578"><tspan>Agent 容器启动</tspan></text><text fill="#475569" text-anchor="middle" x="380" y="601"><tspan>挂载 /data，接收 podType、foreign.url、agentId</tspan></text><text fill="#475569" text-anchor="middle" x="380" y="622"><tspan>向 WAP 回传 Pod 主机信息与运行状态</tspan></text><circle fill="#9333ea" cx="695" cy="602" r="17"/><text fill="#ffffff" text-anchor="middle" x="695" y="607"><tspan>8</tspan></text><rect fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" x="730" y="550" width="350" height="105"/><text fill="#1e293b" text-anchor="middle" x="905" y="578"><tspan>WAP 保存 PodRecord 并轮询</tspan></text><text fill="#475569" text-anchor="middle" x="905" y="601"><tspan>匹配 hostName 前缀、agentId 前缀与 pod=true</tspan></text><text fill="#475569" text-anchor="middle" x="905" y="622"><tspan>每 10 秒记录 Pod Condition 与注册数量</tspan></text><circle fill="#9333ea" cx="1205" cy="602" r="17"/><text fill="#ffffff" text-anchor="middle" x="1205" y="607"><tspan>9</tspan></text><rect fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" x="1240" y="550" width="110" height="105"/><text fill="#1e293b" text-anchor="middle" x="1295" y="578"><tspan>就绪条件</tspan></text><text fill="#475569" text-anchor="middle" x="1295" y="601"><tspan>注册数量</tspan></text><text fill="#475569" text-anchor="middle" x="1295" y="620"><tspan>= replicas</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 555 603 L 678 603" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1080 603 L 1188 603" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1143 407 L 1143 534 L 380 534 L 380 550" marker-end="url(#arrow)"/><text fill="#475569" text-anchor="middle" x="760" y="527"><tspan>StatefulSet 调度完成后，Agent 才开始注册</tspan></text><rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" x="42" y="728" width="1356" height="210" rx="13.56" ry="13.65"/><text fill="#334155" x="68" y="758"><tspan>4. MongoDB 拓扑创建与运行</tspan></text><circle fill="#16a34a" cx="250" cy="842" r="17"/><text fill="#ffffff" text-anchor="middle" x="250" y="847"><tspan>10</tspan></text><rect fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" x="285" y="790" width="325" height="106"/><text fill="#1e293b" text-anchor="middle" x="447" y="818"><tspan>选择 MongoDB 架构</tspan></text><text fill="#475569" text-anchor="middle" x="447" y="841"><tspan>单机、副本集或分片集群</tspan></text><text fill="#475569" text-anchor="middle" x="447" y="862"><tspan>生成成员、端口、数据目录与任务命令</tspan></text><circle fill="#16a34a" cx="755" cy="842" r="17"/><text fill="#ffffff" text-anchor="middle" x="755" y="847"><tspan>11</tspan></text><rect fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5" x="790" y="790" width="325" height="106"/><text fill="#1e293b" text-anchor="middle" x="952" y="818"><tspan>Agent 执行 MongoDB 部署</tspan></text><text fill="#475569" text-anchor="middle" x="952" y="841"><tspan>安装、启动 MongoDB 进程并初始化拓扑</tspan></text><text fill="#475569" text-anchor="middle" x="952" y="862"><tspan>指标、日志和状态持续回传 WAP</tspan></text><circle fill="#16a34a" cx="1230" cy="842" r="17"/><text fill="#ffffff" text-anchor="middle" x="1230" y="847"><tspan>12</tspan></text><rect fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" x="1265" y="790" width="90" height="106"/><text fill="#1e293b" text-anchor="middle" x="1310" y="818"><tspan>验收</tspan></text><text fill="#475569" text-anchor="middle" x="1310" y="841"><tspan>成员健康</tspan></text><text fill="#475569" text-anchor="middle" x="1310" y="862"><tspan>监控可用</tspan></text><path fill="none" stroke="#475569" stroke-width="2" d="M 610 843 L 738 843" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1115 843 L 1213 843" marker-end="url(#arrow)"/><path fill="none" stroke="#475569" stroke-width="2" d="M 1295 655 L 1295 748 L 447 748 L 447 790" marker-end="url(#arrow)"/><text fill="#475569" text-anchor="middle" x="870" y="741"><tspan>Pod 全部就绪后，才进入 MongoDB 创建阶段</tspan></text></svg>
