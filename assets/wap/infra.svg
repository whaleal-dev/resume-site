<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">WAP 平台架构图</title>
  <desc id="desc">展示用户、Nginx、API 网关、管理服务、数据采集服务、Agent、MongoDB、Nacos 和外部系统之间的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#51627a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c56a16"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .zone-title { font: 700 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .box { stroke-width: 1.5; rx: 10; }
      .access { fill: #e0f2fe; stroke: #38bdf8; }
      .gateway { fill: #ede9fe; stroke: #8b5cf6; }
      .service { fill: #dcfce7; stroke: #22c55e; }
      .agent { fill: #fef3c7; stroke: #f59e0b; }
      .store { fill: #fee2e2; stroke: #ef4444; }
      .external { fill: #fff7ed; stroke: #fb923c; }
      .box-title { font: 700 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; text-anchor: middle; }
      .box-sub { font: 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .flow { fill: none; stroke: #51627a; stroke-width: 2; marker-end: url(#arrow); }
      .control { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .external-flow { fill: none; stroke: #c56a16; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arrowOrange); }
      .label { font: 12px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .legend { font: 12px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="920"/>
  <text x="720" y="38" text-anchor="middle" style="font: 700 24px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0f172a;">WAP（Whaleal Platform）平台架构</text>
  <text x="720" y="63" text-anchor="middle" style="font: 13px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #64748b;">MongoDB 统一管理、监控与运维平台</text>

  <rect class="zone" x="45" y="95" width="1350" height="116" rx="14"/>
  <text class="zone-title" x="68" y="123">接入层</text>
  <rect class="box access" x="305" y="127" width="200" height="62"/>
  <text class="box-title" x="405" y="153">浏览器 / 前端</text>
  <text class="box-sub" x="405" y="176">管理控制台</text>
  <rect class="box access" x="730" y="127" width="220" height="62"/>
  <text class="box-title" x="840" y="153">Nginx</text>
  <text class="box-sub" x="840" y="176">静态资源与 /wap/api/ 反向代理</text>

  <rect class="zone" x="45" y="235" width="1350" height="126" rx="14"/>
  <text class="zone-title" x="68" y="263">统一服务入口</text>
  <rect class="box gateway" x="580" y="278" width="280" height="64"/>
  <text class="box-title" x="720" y="304">ops-gateway</text>
  <text class="box-sub" x="720" y="327">路由、跨域、负载均衡</text>

  <rect class="zone" x="45" y="385" width="930" height="226" rx="14"/>
  <text class="zone-title" x="68" y="413">平台服务层</text>
  <rect class="box service" x="205" y="450" width="285" height="102"/>
  <text class="box-title" x="347" y="478">ops-server-web</text>
  <text class="box-sub" x="347" y="503">资产、任务、策略、告警</text>
  <text class="box-sub" x="347" y="525">备份恢复、诊断、云与 K8s 管理</text>
  <rect class="box service" x="615" y="450" width="285" height="102"/>
  <text class="box-title" x="757" y="478">data-collection-api</text>
  <text class="box-sub" x="757" y="503">指标、日志、诊断与 DDT 数据接收</text>
  <text class="box-sub" x="757" y="525">命令与采集配置查询</text>
  <rect class="box store" x="1045" y="418" width="285" height="74"/>
  <text class="box-title" x="1187" y="447">MongoDB</text>
  <text class="box-sub" x="1187" y="470">配置、资产、指标、事件与任务记录</text>
  <rect class="box gateway" x="1045" y="518" width="285" height="70"/>
  <text class="box-title" x="1187" y="546">Nacos</text>
  <text class="box-sub" x="1187" y="569">服务注册与发现</text>

  <rect class="zone" x="45" y="636" width="930" height="198" rx="14"/>
  <text class="zone-title" x="68" y="664">采集执行面与被管环境</text>
  <rect class="box agent" x="175" y="700" width="300" height="88"/>
  <text class="box-title" x="325" y="728">agent-collection</text>
  <text class="box-sub" x="325" y="752">主机 / MongoDB 指标、日志、诊断</text>
  <text class="box-sub" x="325" y="773">命令执行、备份恢复、同步任务</text>
  <rect class="box external" x="630" y="700" width="285" height="88"/>
  <text class="box-title" x="772" y="728">被管环境</text>
  <text class="box-sub" x="772" y="752">MongoDB 单机、副本集、分片集群</text>
  <text class="box-sub" x="772" y="773">主机或 Kubernetes Pod</text>

  <rect class="zone" x="1000" y="636" width="395" height="198" rx="14"/>
  <text class="zone-title" x="1023" y="664">外部集成</text>
  <rect class="box external" x="1042" y="700" width="310" height="38"/>
  <text class="box-title" x="1197" y="725">AWS / Kubernetes / 对象存储</text>
  <rect class="box external" x="1042" y="766" width="310" height="38"/>
  <text class="box-title" x="1197" y="791">邮件 / 钉钉 / 飞书通知</text>

  <path class="flow" d="M505,158 H730"/>
  <text class="label" x="617" y="148">HTTPS</text>
  <path class="flow" d="M840,189 V278"/>
  <text class="label" x="877" y="240">/wap/api/</text>
  <path class="flow" d="M660,342 V405 H347 V450"/>
  <text class="label" x="462" y="397">/api/server/**</text>
  <path class="flow" d="M780,342 V450"/>
  <text class="label" x="821" y="401">/api/collection/**</text>
  <path class="flow" d="M490,501 H615"/>
  <text class="label" x="552" y="491">控制 / 告警处理</text>
  <path class="flow" d="M757,552 V662 H475 V744"/>
  <text class="label" x="570" y="651">采集数据、命令、文件</text>
  <path class="flow" d="M475,744 H630"/>
  <text class="label" x="552" y="733">本地采集与执行</text>
  <path class="flow" d="M490,470 H1045"/>
  <path class="flow" d="M900,530 H1045"/>
  <text class="label" x="972" y="457">持久化</text>
  <path class="control" d="M720,342 V380 H1187 V518"/>
  <path class="control" d="M347,450 V410 H1140 V518"/>
  <path class="control" d="M900,480 H980 V552 H1045"/>
  <text class="label" x="1010" y="398">注册 / 发现</text>
  <path class="external-flow" d="M490,540 H1008 V719 H1042"/>
  <path class="external-flow" d="M490,525 H990 V785 H1042"/>
  <text class="label" x="950" y="711">资源编排 / 文件归档</text>
  <text class="label" x="948" y="777">告警通知</text>

  <line x1="350" y1="874" x2="390" y2="874" class="flow"/>
  <text class="legend" x="406" y="878">业务请求、数据或控制调用</text>
  <line x1="690" y1="874" x2="730" y2="874" class="control"/>
  <text class="legend" x="746" y="878">服务注册与发现</text>
  <line x1="985" y1="874" x2="1025" y2="874" class="external-flow"/>
  <text class="legend" x="1041" y="878">外部系统集成</text>
</svg>
